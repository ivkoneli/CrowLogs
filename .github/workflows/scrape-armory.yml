name: Scrape armory (ilvl + talents)

# Refreshes the Supabase `characters` cache from the Tauri armory (ilvl/talents/etc).
# Runs every 12h. Auth is the persistent `username`/`pasw` credential cookie in the
# TAURI_COOKIE secret — it doesn't expire, so there's no session to keep alive and no
# routine re-paste. If the credentials ever stop working (e.g. you changed your Tauri
# password), the run FAILS on purpose and GitHub emails the repo owner; recover by
# re-setting TAURI_COOKIE to a fresh "username=…; pasw=…" and re-running.
# NOTE: GitHub auto-disables scheduled workflows after 60 days with no repo commits —
# if scraping silently stops, re-enable it here.
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch: # manual "Run workflow" button

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/scrape-armory.mjs
        env:
          # Persistent Tauri credential cookie: "username=…; pasw=…". Static — re-set
          # only when you change your Tauri password.
          TAURI_COOKIE: ${{ secrets.TAURI_COOKIE }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DEFAULT_REALM: '[EN] Evermoon'
