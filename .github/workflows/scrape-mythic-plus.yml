name: Scrape Mythic+ leaderboards

# Mirrors Tauri's armory Challenge Mode leaderboards into the Supabase `mplus_runs`
# table, so a player's M+ best runs + history are one indexed lookup on the profile.
# Same TAURI_COOKIE / SUPABASE_SERVICE_KEY secrets as the armory scrape. Fails on purpose
# (GitHub emails the repo owner) if the cookie stops working or Tauri changes the page.
#
# Started by Supabase, not by a `schedule:` here: GitHub's cron ran "hourly" every 3-5 h.
# pg_cron calls dispatch_mplus_scrape() (see supabase/schema.sql) hourly at :05, and with
# full=true Wednesday 04:47 UTC (before the EU reset) — the weekly pass that re-reads every
# run on every board, so renamed/deleted characters' stale runs are pruned. It emails the
# owner if GitHub refuses a dispatch or no scrape has finished in 3 h. No schedule also
# means GitHub's 60-days-without-commits auto-disable doesn't apply.
on:
  workflow_dispatch:
    inputs:
      full:
        description: 'Re-check every run on the boards (backfill / repair), not just recent days'
        type: boolean
        default: false

# Never let two scrapes overlap (a slow run + the next hour's trigger).
concurrency:
  group: scrape-mythic-plus
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/scrape-mythic-plus.mjs
        env:
          TAURI_COOKIE: ${{ secrets.TAURI_COOKIE }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MPLUS_FULL: ${{ inputs.full && '1' || '' }}
